<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friday</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #050a0e; --sidebar: #070d14; --surface: #0a1628;
      --accent: #00d4ff; --accent2: #0066ff; --accent3: #00ff88;
      --text: #e0f0ff; --text-dim: #5a7a99;
      --border: rgba(0,212,255,0.12); --glow: rgba(0,212,255,0.25);
      --red: #ff4466; --red-glow: rgba(255,68,102,0.4);
      --user-bubble: linear-gradient(135deg,#0a2550,#0a3a6e);
      --ai-bubble: linear-gradient(135deg,#071a30,#0a1f3a);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; overflow:hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 260px; min-width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: transform 0.3s;
      z-index: 20;
    }
    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-title {
      font-family: 'Orbitron', monospace; font-size: 14px;
      font-weight: 900; letter-spacing: 3px; color: var(--accent);
      text-shadow: 0 0 12px var(--glow);
    }
    .new-chat-btn {
      width: 30px; height: 30px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .new-chat-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--glow); }

    .chat-list { flex:1; overflow-y:auto; padding: 8px; }
    .chat-list::-webkit-scrollbar { width: 3px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .chat-group-label {
      font-size: 10px; color: var(--text-dim); letter-spacing: 1.5px;
      font-family: 'Share Tech Mono', monospace;
      padding: 10px 8px 4px; text-transform: uppercase;
    }
    .chat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
      transition: background 0.15s; gap: 8px; group: true;
    }
    .chat-item:hover { background: rgba(0,212,255,0.06); }
    .chat-item.active { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2); }
    .chat-item-title {
      font-size: 13px; color: var(--text); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .chat-item.active .chat-item-title { color: var(--accent); }
    .chat-delete {
      width: 20px; height: 20px; border-radius: 4px; border: none;
      background: transparent; color: var(--text-dim); cursor: pointer;
      font-size: 12px; opacity: 0; transition: opacity 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .chat-item:hover .chat-delete { opacity: 1; }
    .chat-delete:hover { color: var(--red); background: rgba(255,68,102,0.1); }

    /* ── MAIN AREA ── */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }

    /* grid bg */
    .main::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image: linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px);
      background-size: 40px 40px;
    }

    /* ── HEADER ── */
    header {
      position:relative; z-index:10; padding:14px 20px;
      display:flex; align-items:center; gap:12px;
      border-bottom:1px solid var(--border);
      background:rgba(5,10,14,0.9); backdrop-filter:blur(20px);
    }
    .menu-btn {
      display:none; width:32px; height:32px; border-radius:8px;
      border:1px solid var(--border); background:transparent;
      color:var(--text-dim); cursor:pointer; font-size:16px;
      align-items:center; justify-content:center;
    }
    .chat-title-display {
      font-size:13px; color:var(--text-dim);
      font-family:'Share Tech Mono',monospace; letter-spacing:1px;
      flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .header-right { display:flex; align-items:center; gap:10px; margin-left:auto; }
    .pill {
      background:#0a1628; border:1px solid var(--border); color:var(--text-dim);
      font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px;
      padding:5px 12px; border-radius:20px; cursor:pointer; transition:all 0.2s;
    }
    .pill:hover { border-color:var(--accent); color:var(--accent); }
    .pill.on { border-color:var(--accent3); color:var(--accent3); background:rgba(0,255,136,0.06); }
    .status { display:flex; align-items:center; gap:6px; font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--accent3); }
    .status-dot { width:6px; height:6px; border-radius:50%; background:var(--accent3); box-shadow:0 0 6px var(--accent3); animation:blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── CHAT ── */
    #chat {
      flex:1; overflow-y:auto; padding:24px 20px;
      display:flex; flex-direction:column; gap:16px;
      position:relative; z-index:1; scroll-behavior:smooth;
    }
    #chat::-webkit-scrollbar { width:4px; }
    #chat::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .welcome { text-align:center; padding:60px 20px; animation:fadeIn 0.6s ease; }
    .welcome h2 { font-family:'Orbitron',monospace; font-size:24px; font-weight:900; color:var(--accent); text-shadow:0 0 24px var(--glow); letter-spacing:4px; margin-bottom:8px; }
    .welcome p { color:var(--text-dim); font-size:13px; font-family:'Share Tech Mono',monospace; letter-spacing:1px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:20px; }
    .sug-btn { background:var(--surface); border:1px solid var(--border); color:var(--text-dim); padding:7px 14px; border-radius:20px; font-size:12px; font-family:'Share Tech Mono',monospace; cursor:pointer; transition:all 0.2s; }
    .sug-btn:hover { border-color:var(--accent); color:var(--accent); }

    .message { display:flex; gap:10px; max-width:800px; width:100%; animation:slideUp 0.25s ease; }
    .message.user { margin-left:auto; flex-direction:row-reverse; }
    @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; font-size:12px; }
    .message.ai .avatar { background:rgba(0,212,255,0.1); border:1px solid var(--accent); box-shadow:0 0 8px var(--glow); font-family:'Orbitron',monospace; font-size:9px; color:var(--accent); }
    .message.user .avatar { background:rgba(0,102,255,0.15); border:1px solid var(--accent2); color:var(--accent2); }

    .bubble { padding:12px 16px; border-radius:14px; font-size:14px; line-height:1.7; max-width:calc(100% - 44px); }
    .message.ai .bubble { background:var(--ai-bubble); border:1px solid var(--border); border-top-left-radius:4px; }
    .message.user .bubble { background:var(--user-bubble); border:1px solid rgba(0,102,255,0.25); border-top-right-radius:4px; }
    .bubble pre { background:rgba(0,0,0,0.4); border:1px solid rgba(0,212,255,0.1); border-radius:8px; padding:12px; overflow-x:auto; margin:8px 0; font-family:'Share Tech Mono',monospace; font-size:12px; line-height:1.6; }
    .bubble code { font-family:'Share Tech Mono',monospace; font-size:12px; background:rgba(0,212,255,0.08); padding:2px 5px; border-radius:3px; color:var(--accent); }
    .bubble pre code { background:none; padding:0; color:#a8d8f0; }

    .typing .bubble { display:flex; align-items:center; gap:5px; padding:14px 16px; }
    .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:bounce 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2){animation-delay:0.2s} .typing-dot:nth-child(3){animation-delay:0.4s}
    @keyframes bounce { 0%,100%{transform:translateY(0);opacity:0.4} 50%{transform:translateY(-5px);opacity:1} }

    /* ── INPUT ── */
    .input-area { position:relative; z-index:10; padding:14px 20px 18px; border-top:1px solid var(--border); background:rgba(5,10,14,0.95); backdrop-filter:blur(20px); }
    .input-wrapper { display:flex; align-items:flex-end; gap:10px; max-width:800px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:9px 12px; transition:all 0.2s; }
    .input-wrapper:focus-within { border-color:var(--accent); box-shadow:0 0 16px var(--glow); }
    .input-wrapper.listening { border-color:var(--red); box-shadow:0 0 16px var(--red-glow); animation:lpulse 1.5s ease-in-out infinite; }
    @keyframes lpulse { 0%,100%{box-shadow:0 0 16px var(--red-glow)} 50%{box-shadow:0 0 30px var(--red-glow)} }
    #userInput { flex:1; background:none; border:none; outline:none; color:var(--text); font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; resize:none; max-height:140px; min-height:24px; padding:2px 0; }
    #userInput::placeholder { color:var(--text-dim); }
    .icon-btn { width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:transparent; color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
    .icon-btn:hover { border-color:var(--accent); color:var(--accent); }
    .icon-btn.recording { background:var(--red); border-color:var(--red); color:white; box-shadow:0 0 14px var(--red-glow); animation:mpulse 1s ease-in-out infinite; }
    @keyframes mpulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .icon-btn svg { width:15px; height:15px; fill:currentColor; }
    #sendBtn { background:linear-gradient(135deg,var(--accent2),var(--accent)); border:none; color:white; box-shadow:0 0 12px var(--glow); }
    #sendBtn:hover { transform:scale(1.06); }
    #sendBtn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
    .hint { text-align:center; margin-top:7px; font-size:11px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; letter-spacing:0.5px; }

    /* Speaking bar */
    .speaking-bar { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,212,255,0.08); border:1px solid var(--accent); border-radius:30px; padding:7px 18px; display:none; align-items:center; gap:10px; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--accent); letter-spacing:1px; z-index:100; box-shadow:0 0 16px var(--glow); }
    .speaking-bar.visible { display:flex; }
    .waves { display:flex; gap:3px; align-items:center; }
    .wave { width:3px; background:var(--accent); border-radius:2px; animation:wanim 0.8s ease-in-out infinite; }
    .wave:nth-child(1){height:6px;animation-delay:0s} .wave:nth-child(2){height:12px;animation-delay:0.1s} .wave:nth-child(3){height:18px;animation-delay:0.2s} .wave:nth-child(4){height:12px;animation-delay:0.3s} .wave:nth-child(5){height:6px;animation-delay:0.4s}
    @keyframes wanim { 0%,100%{transform:scaleY(0.4);opacity:0.5} 50%{transform:scaleY(1);opacity:1} }
    .stop-btn { background:none; border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:2px 8px; cursor:pointer; font-family:'Share Tech Mono',monospace; font-size:10px; }

    @keyframes flashFade { 0%{opacity:1;transform:translateX(-50%) scale(1)} 70%{opacity:1} 100%{opacity:0;transform:translateX(-50%) scale(0.95)} }

    /* Mobile */
    @media(max-width:700px) {
      .sidebar { position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%); }
      .sidebar.open { transform:translateX(0); box-shadow:4px 0 20px rgba(0,0,0,0.5); }
      .menu-btn { display:flex; }
      header { padding:12px 14px; }
      #chat { padding:14px 12px; }
      .input-area { padding:10px 12px 14px; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">FRIDAY</span>
    <button class="new-chat-btn" onclick="newChat()" title="New Chat">＋</button>
  </div>
  <div class="chat-list" id="chatList"></div>
</aside>

<!-- Main -->
<div class="main">
  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="chat-title-display" id="chatTitleDisplay">New Chat</span>
    <div class="header-right">
      <div class="pill" id="alwaysOnBtn" onclick="toggleAlwaysOn()">VAD OFF</div>
      <div class="pill" id="voiceToggle" onclick="toggleVoiceOutput()">VOICE OUT</div>
      <div class="status"><div class="status-dot"></div>ONLINE</div>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h2>GOOD TO SEE YOU</h2>
      <p>// FRIDAY INITIALIZED — HOW CAN I HELP YOU BUILD TODAY?</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="sendSuggestion('Help me plan my project architecture')">🏗️ Plan architecture</button>
        <button class="sug-btn" onclick="sendSuggestion('Review and debug my code')">🐛 Debug code</button>
        <button class="sug-btn" onclick="sendSuggestion('What are best tools for my project?')">🛠️ Best tools</button>
        <button class="sug-btn" onclick="sendSuggestion('Help me learn something new today')">📚 Learn something</button>
      </div>
    </div>
  </div>

  <div class="speaking-bar" id="speakingBar">
    <div class="waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
    FRIDAY SPEAKING...
    <button class="stop-btn" onclick="stopSpeaking()">STOP</button>
  </div>

  <div class="input-area">
    <div class="input-wrapper" id="inputWrapper">
      <textarea id="userInput" placeholder="Talk to Friday..." rows="1"></textarea>
      <button class="icon-btn" id="micBtn" onclick="toggleMic()" title="Voice input">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 1.93c-3.94-.49-7-3.85-7-7.93H2c0 4.97 3.53 9.09 8.25 9.93V21h3.5v-2.07C18.47 18.09 22 13.97 22 9h-2c0 4.08-3.06 7.44-7 7.93V15.93z"/></svg>
      </button>
      <button class="icon-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="hint" id="hintText">Enter to send · Shift+Enter for newline · 🎤 mic for voice</p>
  </div>
</div>

<script>
  // ── State ──
  let currentChatId = null;
  let isTyping = false;
  let isRecording = false;
  let voiceOutputEnabled = false;
  let alwaysOnMode = false;
  let recognition = null;
  let silenceTimer = null;

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const inputWrapper = document.getElementById('inputWrapper');
  const speakingBar = document.getElementById('speakingBar');
  const chatTitleDisplay = document.getElementById('chatTitleDisplay');

  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

  // ── Sidebar ──
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  async function loadChatList() {
    const res = await fetch('/chats');
    const chats = await res.json();
    const listEl = document.getElementById('chatList');
    listEl.innerHTML = '';

    if (chats.length === 0) {
      listEl.innerHTML = '<div style="padding:16px;color:var(--text-dim);font-size:12px;font-family:Share Tech Mono,monospace;text-align:center">No chats yet</div>';
      return;
    }

    // Group by Today / Previous
    const now = Date.now();
    const todayChats = chats.filter(c => now - c.updatedAt < 86400000);
    const olderChats = chats.filter(c => now - c.updatedAt >= 86400000);

    if (todayChats.length > 0) {
      listEl.innerHTML += '<div class="chat-group-label">Today</div>';
      todayChats.forEach(c => listEl.appendChild(makeChatItem(c)));
    }
    if (olderChats.length > 0) {
      listEl.innerHTML += '<div class="chat-group-label">Previous</div>';
      olderChats.forEach(c => listEl.appendChild(makeChatItem(c)));
    }
  }

  function makeChatItem(chat) {
    const div = document.createElement('div');
    div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
    div.innerHTML = `
      <span class="chat-item-title">${chat.title}</span>
      <button class="chat-delete" onclick="deleteChat(event,'${chat.id}')" title="Delete">✕</button>
    `;
    div.onclick = (e) => { if (!e.target.classList.contains('chat-delete')) switchChat(chat.id); };
    return div;
  }

  async function newChat() {
    const res = await fetch('/chats/new', { method: 'POST' });
    const data = await res.json();
    currentChatId = data.id;
    chatEl.innerHTML = '<div class="welcome" id="welcome"><h2>GOOD TO SEE YOU</h2><p>// NEW CHAT STARTED — WHAT ARE WE BUILDING?</p></div>';
    chatTitleDisplay.textContent = 'New Chat';
    await loadChatList();
    document.getElementById('sidebar').classList.remove('open');
    inputEl.focus();
  }

  async function switchChat(id) {
    currentChatId = id;
    const res = await fetch(`/chats/${id}`);
    const data = await res.json();

    chatEl.innerHTML = '';
    chatTitleDisplay.textContent = data.title;

    if (data.messages.length === 0) {
      chatEl.innerHTML = '<div class="welcome" id="welcome"><h2>GOOD TO SEE YOU</h2><p>// FRIDAY INITIALIZED — HOW CAN I HELP?</p></div>';
    } else {
      data.messages.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'ai', m.content, false));
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    await loadChatList();
    document.getElementById('sidebar').classList.remove('open');
  }

  async function deleteChat(e, id) {
    e.stopPropagation();
    await fetch(`/chats/${id}`, { method: 'DELETE' });
    if (currentChatId === id) {
      currentChatId = null;
      chatEl.innerHTML = '<div class="welcome" id="welcome"><h2>GOOD TO SEE YOU</h2><p>// SELECT OR START A NEW CHAT</p></div>';
      chatTitleDisplay.textContent = 'Friday';
    }
    await loadChatList();
  }

  // ── Voice Output ──
  function toggleVoiceOutput() {
    voiceOutputEnabled = !voiceOutputEnabled;
    document.getElementById('voiceToggle').classList.toggle('on', voiceOutputEnabled);
  }

  function speak(text) {
    if (!voiceOutputEnabled) {
      if (alwaysOnMode) setTimeout(() => startListening(), 400);
      return;
    }
    stopSpeaking();
    const clean = text.replace(/```[\s\S]*?```/g,'code block').replace(/`([^`]+)`/g,'$1').replace(/\*\*(.*?)\*\*/g,'$1').replace(/#+\s/g,'').replace(/\n/g,' ').trim();
    const utt = new SpeechSynthesisUtterance(clean);
    utt.rate = 1.05; utt.pitch = 1.0; utt.volume = 1;
    const voices = speechSynthesis.getVoices();
    const pref = voices.find(v => v.name.includes('Google UK English Female') || v.name.includes('Samantha') || v.name.includes('Karen')) || voices.find(v => v.lang.startsWith('en'));
    if (pref) utt.voice = pref;
    utt.onstart = () => { speakingBar.classList.add('visible'); if (alwaysOnMode && isRecording) stopListening(false); };
    utt.onend = () => { speakingBar.classList.remove('visible'); if (alwaysOnMode) setTimeout(() => startListening(), 400); };
    utt.onerror = () => { speakingBar.classList.remove('visible'); if (alwaysOnMode) setTimeout(() => startListening(), 400); };
    speechSynthesis.speak(utt);
  }

  function stopSpeaking() { speechSynthesis.cancel(); speakingBar.classList.remove('visible'); }

  // ── Always-On VAD ──
  function toggleAlwaysOn() {
    alwaysOnMode = !alwaysOnMode;
    const btn = document.getElementById('alwaysOnBtn');
    btn.classList.toggle('on', alwaysOnMode);
    btn.textContent = alwaysOnMode ? 'VAD ON' : 'VAD OFF';
    if (alwaysOnMode) { voiceOutputEnabled = true; document.getElementById('voiceToggle').classList.add('on'); startListening(); document.getElementById('hintText').textContent = '🟢 Always-on — just speak naturally'; }
    else { document.getElementById('hintText').textContent = 'Enter to send · Shift+Enter for newline · 🎤 mic for voice'; stopListening(); }
  }

  // ── Speech Recognition ──
  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Use Chrome or Edge for voice input.'); return null; }
    const r = new SR();
    r.continuous = true; r.interimResults = true; r.lang = 'en-US';
    r.onstart = () => { isRecording = true; micBtn.classList.add('recording'); inputWrapper.classList.add('listening'); inputEl.placeholder = alwaysOnMode ? '👂 Listening...' : '🎤 Listening...'; };
    r.onresult = (event) => {
      clearTimeout(silenceTimer);
      let interim = '', final = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t; else interim += t;
      }
      const heard = (final || interim).trim();
      if (speechSynthesis.speaking && heard.length > 0) { stopSpeaking(); showFlash('⚡ INTERRUPTED'); }
      inputEl.value = heard;
      if (final && alwaysOnMode) silenceTimer = setTimeout(() => { if (inputEl.value.trim()) sendMessage(); }, 1000);
    };
    r.onend = () => {
      isRecording = false; micBtn.classList.remove('recording'); inputWrapper.classList.remove('listening');
      inputEl.placeholder = 'Talk to Friday...';
      if (!alwaysOnMode) { if (inputEl.value.trim()) setTimeout(() => sendMessage(), 300); }
      else if (!speechSynthesis.speaking && !isTyping) setTimeout(() => startListening(), 300);
    };
    r.onerror = (e) => {
      isRecording = false; micBtn.classList.remove('recording'); inputWrapper.classList.remove('listening');
      if (e.error === 'no-speech' && alwaysOnMode) setTimeout(() => startListening(), 300);
    };
    return r;
  }

  function startListening() {
    if (isRecording || speechSynthesis.speaking || isTyping) return;
    if (!recognition) recognition = setupRecognition();
    if (!recognition) return;
    try { recognition.start(); } catch(e) {}
  }

  function stopListening(full = true) {
    if (full) alwaysOnMode = false;
    clearTimeout(silenceTimer);
    try { if (recognition && isRecording) recognition.stop(); } catch(e) {}
  }

  function toggleMic() {
    if (alwaysOnMode) { if (speechSynthesis.speaking) { stopSpeaking(); showFlash('⚡ INTERRUPTED'); setTimeout(() => startListening(), 200); } return; }
    if (!recognition) recognition = setupRecognition();
    if (!recognition) return;
    if (isRecording) { recognition.stop(); }
    else { if (speechSynthesis.speaking) { stopSpeaking(); showFlash('⚡ INTERRUPTED'); } inputEl.value = ''; try { recognition.start(); } catch(e) {} }
  }

  function showFlash(msg) {
    const f = document.createElement('div');
    f.textContent = msg;
    f.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(255,68,102,0.12);border:1px solid var(--red);color:var(--red);font-family:Share Tech Mono,monospace;font-size:11px;letter-spacing:2px;padding:5px 14px;border-radius:20px;z-index:999;animation:flashFade 1s ease forwards;';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }

  // ── UI Helpers ──
  inputEl.addEventListener('input', () => { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px'; });
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  function sendSuggestion(t) { inputEl.value = t; sendMessage(); }

  function appendMessage(role, content, animate = true) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();
    const msg = document.createElement('div');
    msg.className = `message ${role}${animate ? '' : ' no-anim'}`;
    const av = document.createElement('div'); av.className = 'avatar'; av.textContent = role === 'ai' ? 'F' : '👤';
    const bub = document.createElement('div'); bub.className = 'bubble'; bub.innerHTML = formatMsg(content);
    msg.appendChild(av); msg.appendChild(bub);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showTyping() {
    const msg = document.createElement('div'); msg.className = 'message ai typing'; msg.id = 'typing-ind';
    const av = document.createElement('div'); av.className = 'avatar'; av.textContent = 'F';
    const bub = document.createElement('div'); bub.className = 'bubble'; bub.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    msg.appendChild(av); msg.appendChild(bub); chatEl.appendChild(msg); chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() { const el = document.getElementById('typing-ind'); if (el) el.remove(); }

  function formatMsg(text) {
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_,l,c) => `<pre><code>${esc(c.trim())}</code></pre>`);
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }
  function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Send Message ──
  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message || isTyping) return;

    // Create chat if none exists
    if (!currentChatId) {
      const res = await fetch('/chats/new', { method: 'POST' });
      const data = await res.json();
      currentChatId = data.id;
    }

    if (alwaysOnMode && isRecording) stopListening(false);
    clearTimeout(silenceTimer);

    inputEl.value = ''; inputEl.style.height = 'auto';
    isTyping = true; sendBtn.disabled = true;

    appendMessage('user', message);
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sessionId: currentChatId })
      });
      const data = await res.json();
      removeTyping();

      if (data.reply) {
        appendMessage('ai', data.reply);
        // Update title in sidebar after first message
        if (data.title && data.title !== 'New Chat') {
          chatTitleDisplay.textContent = data.title;
          await loadChatList();
        }
        speak(data.reply);
      } else {
        appendMessage('ai', '⚠️ ' + (data.error || 'Something went wrong.'));
        if (alwaysOnMode) setTimeout(() => startListening(), 500);
      }
    } catch {
      removeTyping();
      appendMessage('ai', '⚠️ Could not reach server.');
      if (alwaysOnMode) setTimeout(() => startListening(), 500);
    }

    isTyping = false; sendBtn.disabled = false;
    if (!alwaysOnMode) inputEl.focus();
  }

  // ── Init ──
  loadChatList();
</script>
</body>
</html>
