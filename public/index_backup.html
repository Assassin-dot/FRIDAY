<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friday — Your AI Agent</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #050a0e;
      --surface: #0a1628;
      --surface2: #0f1f3d;
      --accent: #00d4ff;
      --accent2: #0066ff;
      --accent3: #00ff88;
      --text: #e0f0ff;
      --text-dim: #5a7a99;
      --border: rgba(0, 212, 255, 0.15);
      --glow: rgba(0, 212, 255, 0.3);
      --user-bubble: linear-gradient(135deg, #0a2550, #0a3a6e);
      --ai-bubble: linear-gradient(135deg, #071a30, #0a1f3a);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse, rgba(0,100,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(5, 10, 14, 0.9);
      backdrop-filter: blur(20px);
    }

    .logo-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--glow), inset 0 0 10px rgba(0,212,255,0.1);
      animation: pulse-ring 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 16px var(--glow), inset 0 0 10px rgba(0,212,255,0.1); }
      50% { box-shadow: 0 0 28px rgba(0,212,255,0.6), inset 0 0 16px rgba(0,212,255,0.2); }
    }

    .logo-ring svg { width: 22px; height: 22px; fill: var(--accent); }

    .header-text h1 {
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 20px var(--glow);
    }

    .header-text p {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      font-family: 'Share Tech Mono', monospace;
      margin-top: 2px;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--accent3);
      letter-spacing: 1px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent3);
      box-shadow: 0 0 8px var(--accent3);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.8s ease;
    }

    .welcome h2 {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 30px var(--glow);
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--text-dim);
      font-size: 14px;
      letter-spacing: 1px;
      font-family: 'Share Tech Mono', monospace;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 24px;
    }

    .suggestion-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Share Tech Mono', monospace;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--glow);
      background: rgba(0,212,255,0.05);
    }

    /* Message bubbles */
    .message {
      display: flex;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message.user { margin-left: auto; flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.ai .avatar {
      background: rgba(0,212,255,0.1);
      border: 1px solid var(--accent);
      box-shadow: 0 0 10px var(--glow);
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--accent);
    }

    .message.user .avatar {
      background: rgba(0,102,255,0.15);
      border: 1px solid var(--accent2);
      color: var(--accent2);
      font-size: 16px;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.7;
      max-width: calc(100% - 50px);
      position: relative;
    }

    .message.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(0,102,255,0.3);
      border-top-right-radius: 4px;
      color: var(--text);
    }

    /* Code blocks in messages */
    .bubble pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(0,212,255,0.1);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .bubble code {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      background: rgba(0,212,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
    }

    .bubble pre code {
      background: none;
      padding: 0;
      color: #a8d8f0;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 16px 18px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: typing-bounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      position: relative;
      z-index: 10;
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: rgba(5,10,14,0.95);
      backdrop-filter: blur(20px);
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--glow);
    }

    #userInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      min-height: 24px;
      padding: 2px 0;
    }

    #userInput::placeholder { color: var(--text-dim); }

    #sendBtn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 0 14px var(--glow);
    }

    #sendBtn:hover { transform: scale(1.08); box-shadow: 0 0 22px var(--glow); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #sendBtn svg { width: 16px; height: 16px; fill: white; }

    .hint {
      text-align: center;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      #chat { padding: 16px 12px; }
      .input-area { padding: 12px 12px 16px; }
      .welcome h2 { font-size: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-ring">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
  </div>
  <div class="header-text">
    <h1>FRIDAY</h1>
    <p>PERSONAL AI AGENT // ONLINE</p>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    SYSTEMS ACTIVE
  </div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>GOOD TO SEE YOU</h2>
    <p>// FRIDAY AGENT INITIALIZED — HOW CAN I HELP YOU BUILD TODAY?</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion('Help me plan my project architecture')">🏗️ Plan project architecture</button>
      <button class="suggestion-btn" onclick="sendSuggestion('Review and debug my code')">🐛 Debug my code</button>
      <button class="suggestion-btn" onclick="sendSuggestion('What are the best tools for building a web app?')">🛠️ Best dev tools</button>
      <button class="suggestion-btn" onclick="sendSuggestion('Help me learn something new today')">📚 Learn something new</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" placeholder="Talk to Friday..." rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <p class="hint">Press Enter to send · Shift+Enter for new line</p>
</div>

<script>
  // Unique session ID per browser tab
  const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
  let isTyping = false;

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendSuggestion(text) {
    inputEl.value = text;
    sendMessage();
  }

  function removeWelcome() {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();
  }

  function appendMessage(role, content) {
    removeWelcome();
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'ai' ? 'F' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatMessage(content);

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return msg;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'message ai typing';
    msg.id = 'typing-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'F';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function formatMessage(text) {
    // Code blocks
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => {
      return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
    });
    // Inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Newlines
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message || isTyping) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    isTyping = true;
    sendBtn.disabled = true;

    appendMessage('user', message);
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sessionId })
      });

      const data = await response.json();
      removeTyping();

      if (data.reply) {
        appendMessage('ai', data.reply);
      } else {
        appendMessage('ai', '⚠️ Error: ' + (data.error || 'Something went wrong.'));
      }
    } catch (err) {
      removeTyping();
      appendMessage('ai', '⚠️ Could not reach the server. Make sure Friday is running.');
    }

    isTyping = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
